<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字芯片设计前端计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔧 数字芯片设计前端计算器</h1>

        <div class="section">
            <h2>64位二进制数转换器</h2>
            <div class="converter-layout">
                <!-- 左: 二进制显示 + 移位 -->
                <div class="left-section">
                    <div class="bit-display-section">
                        <h3>二进制位显示 <span class="hint">(点击翻转)</span></h3>
                        <div class="bit-rows" id="bitRows"></div>
                    </div>
                    <div class="shift-section">
                        <h3>移位运算 <span class="hint">(仅输出结果)</span></h3>
                        <div class="shift-row">
                            <label>位数:</label>
                            <input type="number" id="mainShiftBits" value="1" min="0" max="64">
                        </div>
                        <div class="shift-modes">
                            <label class="shift-mode-label">
                                <input type="radio" name="mainShiftMode" value="logical" checked> 逻辑移位 (补0)
                            </label>
                            <label class="shift-mode-label">
                                <input type="radio" name="mainShiftMode" value="arithmetic"> 算术移位 (补符号位)
                            </label>
                            <label class="shift-mode-label">
                                <input type="radio" name="mainShiftMode" value="rotate"> 循环移位
                            </label>
                        </div>
                        <div class="shift-btns">
                            <button onclick="mainShift('left')">⟵ 左移</button>
                            <button onclick="mainShift('right')">右移 ⟶</button>
                            <button class="btn-secondary-sm" onclick="resetMainShift()">↺ 重置</button>
                        </div>
                        <div class="shift-preview">
                            <span class="label">移位结果:</span>
                            <div id="mainShiftResult" class="value"><span style="color:#666">(输入位数后点击方向)</span></div>
                        </div>
                    </div>
                </div>

                <!-- 中: 数值表示 -->
                <div class="representation-section">
                    <h3>数值表示 <span class="hint">(支持编辑)</span></h3>
                    <div class="input-group">
                        <label>十六进制:</label>
                        <input type="text" id="hexInput" placeholder="0x0000000000000000" spellcheck="false">
                    </div>
                    <div class="input-group">
                        <label>十进制:</label>
                        <input type="text" id="decInput" placeholder="0" spellcheck="false">
                    </div>
                    <div class="input-group">
                        <label>二进制:</label>
                        <input type="text" id="binInput" placeholder="0000 ... 0000" spellcheck="false">
                    </div>
                </div>

                <!-- 右: 域段提取 -->
                <div class="field-extract-section">
                    <h3>域段提取</h3>
                    <div id="fieldList"></div>
                    <button class="btn-add" onclick="addField()">+ 添加域段</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>混合进制计算器</h2>
            <p class="section-desc">
                直接输入算式，每个数字可带进制前缀：
                <code>0x</code> 十六进制、<code>0b</code> 二进制、<code>0d</code> 十进制（默认）<br>
                支持按位运算：<code>&amp;</code> AND、<code>|</code> OR、<code>^</code> XOR、<code>~</code> NOT
            </p>
            <div class="calc-input-row">
                <input type="text" id="exprInput" placeholder="例: 0xFF & 0b1010 | 0x1A ^ ~0x0F" spellcheck="false">
                <button onclick="calculateExpr()">= 计算</button>
                <button class="btn-secondary" onclick="document.getElementById('exprInput').value=''; clearResult();">清空</button>
            </div>
            <div id="calcError" class="calc-error"></div>
            <div class="calc-result" id="calcResult">
                <div class="result-grid">
                    <div class="result-item">
                        <label>二进制:</label>
                        <span id="resultBin">-</span>
                    </div>
                    <div class="result-item">
                        <label>十进制:</label>
                        <span id="resultDec">-</span>
                    </div>
                    <div class="result-item">
                        <label>十六进制:</label>
                        <span id="resultHex">-</span>
                    </div>
                </div>
            </div>
            <div class="calc-history" id="calcHistory"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
